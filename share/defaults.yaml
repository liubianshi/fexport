# fexport 统一配置文件 — 默认值、Pandoc 设置、格式特定配置

# ============================================================================
# fexport 默认设置
# ============================================================================

_defaults:
  verbose: 0
  keep: 0
  preview: 0
  lang: zh

# ============================================================================
# Pandoc 通用配置
# ============================================================================

pandoc:
  cmd: "pandoc +RTS -M512M -RTS"
  # 识别为 Markdown 的文件扩展名
  markdown-exts:
    - md
    - markdown
    - rmd
    - rmarkdown
    - qmd
    - quarto
  filters:
    - "--filter=pandoc-crossref"
    - "--lua-filter=${FEXPORT_SHARE}/filters/rm-test-table-line.lua"
    - "--citeproc"
    - "--lua-filter=${FEXPORT_SHARE}/filters/rsbc.lua"
  user-opts: []

# ============================================================================
# 共享配置 (YAML 锚点)
# ============================================================================

# Markdown 扩展
_markdown:
  # 基础扩展 (from-extensions 用)
  extensions: &md_extensions
    - emoji
    - east_asian_line_breaks
    - autolink_bare_uris
    - mark
    - lists_without_preceding_blankline
    - wikilinks_title_before_pipe

  # TeX 格式额外增加 raw_tex
  tex_extensions: &md_tex_extensions
    - emoji
    - east_asian_line_breaks
    - autolink_bare_uris
    - mark
    - lists_without_preceding_blankline
    - wikilinks_title_before_pipe
    - raw_tex

# 字体配置
_fonts:
  # CJK 字体 (所有格式通用)
  cjk: &cjk_fonts
    CJKmainfont: "方正聚珍新仿简体"
    CJKsansfont: "Source Han Sans CN"
    CJKmonofont: "LXGW WenKai Mono"

  # 西文字体 (正文/PDF/TeX)
  western: &western_fonts
    mainfont: "Times New Roman"
    sansfont: "Source Han Sans CN"
    monofont: "FiraCode Nerd Font Mono"
    mathfont: "DejaVu Math TeX Gyre"

  # 西文字体 (Beamer 专用) — 已定义但尚未接入 beamer_vars，待启用
  western_beamer: &western_beamer_fonts
    mainfont: "P052 Roman"
    sansfont: "Noto Sans"
    monofont: "Fira Code"

# 参考文献 (biblatex)
_bibliography:
  biblatex: &biblatex_opts
    biblio-style: "gb7714-2015ay"
    biblio-title: "参考文献"
    biblatexoptions: "backend=biber,gbnamefmt=familyahead"

# 通用 metadata
_metadata:
  chinese: &chinese_meta
    author: ["罗伟"]
    reference-section-title: "参考文献"
    link-citations: true

# 组合变量锚点
# 依赖 YAML 1.1 多 << 合并语义 (PyYAML 默认支持，strictyaml/1.2 不支持)
# pdf/tex/beamer 当前相同，保留独立锚点便于后续差异化
_variables:
  tex: &tex_vars
    <<: [*cjk_fonts, *western_fonts, *biblatex_opts]
    indent: true

  beamer: &beamer_vars
    <<: [*cjk_fonts, *western_fonts, *biblatex_opts]

# ============================================================================
# 格式特定配置
# ext: 输出扩展名 | intermediate(_ext): 多步转换中间格式
# from-extensions: 自动构建 Pandoc --from 字符串的 Markdown 扩展列表
# ============================================================================

beamer:
  ext: pdf
  intermediate: latex
  intermediate_ext: tex
  from-extensions: *md_extensions
  syntax-highlighting: "pygments"
  pdf-engine: xelatex
  slide-level: 2
  citeproc: true
  template: "${FEXPORT_SHARE}/templates/beamer-diy"
  include-in-header:
    - "${FEXPORT_SHARE}/header.tex"
    - "${FEXPORT_SHARE}/beamerheader.tex"
  variables:
    <<: *beamer_vars
    fonttheme: structurebold
    institute: "南开大学 APEC 研究中心"
    section-titles: false
    toc: false
    toc-title: "主要内容"
    toc-depth: 1

docx:
  ext: docx
  from-extensions: *md_extensions
  syntax-highlighting: pygments
  reference-doc: ${FEXPORT_SHARE}/templates/economic-research-china.docx
  csl: ${FEXPORT_SHARE}/china-national-standard-gb-t-7714-2015-author-date.csl
  metadata:
    link-citations: false

html:
  ext: html
  from-extensions: *md_extensions
  to: html
  template: normal
  syntax-highlighting: pygments
  html-math-method:
    method: katex
  embed-resources: false
  metadata:
    reference-section-title: "参考文献"
    link-citations: true

pdf:
  ext: pdf
  intermediate: latex
  intermediate_ext: tex
  metadata:
    <<: *chinese_meta
  from-extensions: *md_extensions
  syntax-highlighting: "pygments"
  template: ${FEXPORT_SHARE}/templates/eisvogel.latex
  listings: true
  pdf-engine: xelatex
  citeproc: true
  include-in-header:
    - "${FEXPORT_SHARE}/header.tex"
  variables:
    <<: *tex_vars

pptx:
  ext: pptx
  from-extensions: *md_extensions
  to: pptx
  citeproc: true
  syntax-highlighting: pygments
  reference-doc: ${FEXPORT_SHARE}/templates/custom-reference.pptx
  csl: ${FEXPORT_SHARE}/china-national-standard-gb-t-7714-2015-author-date.csl
  metadata:
    reference-section-title: "参考文献"
    link-citations: true

# tex 与 latex 当前配置相同，保留独立条目供格式处理逻辑区分
tex:
  ext: tex
  metadata:
    <<: *chinese_meta
  from-extensions: *md_tex_extensions
  syntax-highlighting: "pygments"
  template: ${FEXPORT_SHARE}/templates/eisvogel.latex
  listings: true
  pdf-engine: xelatex
  variables:
    <<: *tex_vars

latex:
  ext: tex
  metadata:
    <<: *chinese_meta
  from-extensions: *md_tex_extensions
  syntax-highlighting: "pygments"
  template: ${FEXPORT_SHARE}/templates/eisvogel.latex
  listings: true
  pdf-engine: xelatex
  variables:
    <<: *tex_vars
